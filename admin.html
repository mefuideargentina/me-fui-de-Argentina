<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | Me Fui de Argentina</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 30px;
    }

    .box {
      max-width: 420px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    #mensaje {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🔐 Administración</h1>
    <p>Me Fui de Argentina</p>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
    >

    <button onclick="login()">
      Iniciar sesión
    </button>

    <div id="mensaje"></div><div id="panel" style="display:none; margin-top:30px;">
  <h2>Anuncios pendientes</h2>
  <div id="pendientes"></div>
</div>
    
  </div>

  <script>
    const SUPABASE_URL = "https://xagsdvh ibdgfmotiomoq.supabase.co".replace(" ", "");
    const SUPABASE_KEY = "sb_publishable_dipmh2_QaDQ-fZ69o_C3hQ_KaarUTlv";

    const supabaseClient =
      window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const mensaje = document.getElementById("mensaje");

      mensaje.textContent = "Ingresando...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        mensaje.textContent = "❌ Email o contraseña incorrectos.";
        return;
      }

      mensaje.textContent = "✅ Sesión iniciada correctamente.";
document.getElementById("panel").style.display = "block";
cargarPendientes();
    }
    async function cargarPendientes() {
  const contenedor = document.getElementById("pendientes");
  contenedor.innerHTML = "Cargando...";

  const { data, error } = await supabaseClient
    .from("anuncios")
    .select("*")
    .eq("estado", "pendiente")
    .order("created_at", { ascending: false });

  if (error) {
    contenedor.innerHTML = "❌ No se pudieron cargar los anuncios.";
    console.error(error);
    return;
  }

  if (!data.length) {
    contenedor.innerHTML = "<p>No hay anuncios pendientes 🎉</p>";
    return;
  }

  contenedor.innerHTML = data.map(a => `
    <div style="
      border:1px solid #ddd;
      border-radius:12px;
      padding:16px;
      margin-bottom:14px;
      background:#fff;
    ">
      <strong>${a.titulo}</strong>
      <p>${a.descripcion || ""}</p>
      <p><b>Ciudad:</b> ${a.ciudad || ""}</p>
      <p><b>Precio:</b> ${a.precio || "Consultar"}</p>
      <p><b>Contacto:</b> ${a.contacto || ""}</p>

      <button onclick="cambiarEstado('${a.id}','aprobado')">
        ✅ Aprobar
      </button>

      <button
        onclick="cambiarEstado('${a.id}','rechazado')"
        style="background:#dc2626;"
      >
        ❌ Rechazar
      </button>
    </div>
  `).join("");
}

async function cambiarEstado(id, estado) {
  const { error } = await supabaseClient
    .from("anuncios")
    .update({ estado })
    .eq("id", id);

  if (error) {
    alert("❌ No se pudo actualizar el anuncio.");
    console.error(error);
    return;
  }

  cargarPendientes();
}
  </script>

</body>
</html>
